services:
  copaw:
    # 使用预构建镜像（推荐）
    image: ghcr.io/log-z/copaw-docker:latest

    # 如需自行构建镜像，请注释上面的 image 配置，并取消注释下面的 build 配置：
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     COPAW_VERSION: ${COPAW_VERSION:-latest}
    # image: copaw:latest
    container_name: copaw

    # 端口映射（v0.0.5 安全更新：仅绑定本地回环地址）
    # 注意：如果修改 COPAW_PORT，需要同步修改左侧端口号
    ports:
      # CoPaw Console
      - "127.0.0.1:${COPAW_PORT:-8088}:${COPAW_PORT:-8088}"

      # OneBot 频道（反向 WS）
      # 用于接入 NapCat/go-cqhttp/Lagrange 等 QQ 协议端
      # 如在此 compose 中运行 OneBot 服务，可直接用容器名 copaw 连接 ws://copaw:6199/ws，无需映射此端口
      # 详细用法请参考官方文档：https://copaw.agentscope.io/docs/channels/#OneBot-v11NapCat--QQ-%E5%AE%8C%E6%95%B4%E5%8D%8F%E8%AE%AE
      # - "127.0.0.1:6199:6199"

    # 环境变量
    environment:
      # CoPaw 基础配置
      - COPAW_CONFIG_FILE=config.json
      - COPAW_LOG_LEVEL=INFO
      - COPAW_PORT=${COPAW_PORT:-8088}
      - TZ=${TZ:-Asia/Shanghai}

      # Web 认证配置 (v0.1.0 新增)
      # 启用后首次访问显示注册页面，本地请求自动绕过认证
      - COPAW_AUTH_ENABLED=${COPAW_AUTH_ENABLED:-false}
      # 自动注册管理员账户（可选，适用于自动化部署）
      - COPAW_AUTH_USERNAME=${COPAW_AUTH_USERNAME:-}
      - COPAW_AUTH_PASSWORD=${COPAW_AUTH_PASSWORD:-}

      # Embedding 服务配置（需同时设置 API_KEY、BASE_URL、MODEL_NAME 才能启用向量搜索）
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-1024}
      - EMBEDDING_CACHE_ENABLED=${EMBEDDING_CACHE_ENABLED:-true}
      - FTS_ENABLED=${FTS_ENABLED:-true}

      # 记忆存储配置
      - MEMORY_STORE_BACKEND=${MEMORY_STORE_BACKEND:-auto}
      - COPAW_MEMORY_COMPACT_THRESHOLD=${COPAW_MEMORY_COMPACT_THRESHOLD:-100000}
      - COPAW_MEMORY_COMPACT_KEEP_RECENT=${COPAW_MEMORY_COMPACT_KEEP_RECENT:-3}
      - COPAW_MEMORY_COMPACT_RATIO=${COPAW_MEMORY_COMPACT_RATIO:-0.7}

      # DashScope (灵积) - 后备方案，建议通过 WebUI 配置
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - DASHSCOPE_BASE_URL=${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}

      # Anthropic (v0.0.5 新增)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

      # Gemini (v0.0.6 新增)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}

      # DeepSeek (v0.1.0 新增)
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}

      # MiniMax (v0.1.0 新增)
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}

      # Kimi (v0.1.0 新增)
      - KIMI_API_KEY=${KIMI_API_KEY:-}

      # Zhipu / 智谱 (v1.0.1 新增)
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}

      # SiliconFlow (v1.0.2 新增)
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}

      # LLM 重试配置 (v0.0.7 新增)
      - COPAW_LLM_MAX_RETRIES=${COPAW_LLM_MAX_RETRIES:-3}
      - COPAW_LLM_BACKOFF_BASE=${COPAW_LLM_BACKOFF_BASE:-1.0}
      - COPAW_LLM_BACKOFF_CAP=${COPAW_LLM_BACKOFF_CAP:-60.0}

      # Tavily 搜索 (用于网络搜索技能)
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}

      # CORS 配置
      - COPAW_CORS_ORIGINS=${COPAW_CORS_ORIGINS:-}

      # 自动初始化
      - COPAW_AUTO_INIT=${COPAW_AUTO_INIT:-true}

    # 数据卷挂载
    volumes:
      # 持久化工作目录
      - copaw-data:/data/copaw

      # 可选：挂载自定义技能目录
      # - ./customized_skills:/data/copaw/customized_skills:ro

      # 可选：挂载本地配置文件
      # - ./config/config.json:/data/copaw/config.json:ro

    # 重启策略
    restart: unless-stopped

    # 健康检查
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 网络配置
    networks:
      - copaw-network

# 数据卷定义
volumes:
  copaw-data:
    driver: local
    name: copaw-data

# 网络定义
networks:
  copaw-network:
    driver: bridge
    name: copaw-network
